name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the backend runs TypeScript directly via
          # --experimental-strip-types, which Node added in 22.6. On 20 the
          # test scripts fail with "node: bad option". Matches the Dockerfile.
          node-version: "22"
          cache: "npm"
          # Single lockfile at the repo root — this is an npm workspaces
          # monorepo, and there is no per-app lockfile to cache from.
          cache-dependency-path: package-lock.json

      # Installs both workspaces from the root lockfile.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Pure logic: JSON extraction, schema coercion, and the allowlist that
      # stops a hallucinated URL from becoming a real payment. No network, no
      # credentials, so it is safe to gate merges on.
      - name: Planner tests
        run: npm run test:planner -w @trident/node-backend

      # Budget gate, spending-cap gate, abort flag, SSE framing, and the
      # guarantee that a private key never reaches the stream or the database.
      - name: Runner tests
        env:
          DB_PATH: ${{ runner.temp }}/ci-runner.db
          JWT_SECRET: ci-only-not-a-real-secret
        run: npm run test:runner -w @trident/node-backend

      # `{placeholder}` handling and the rule that decides what the agent may be
      # offered. Worth a merge gate: the invariant here is that nothing is
      # withheld from the planner except an endpoint the prober confirmed dead,
      # and a regression in it silently shrinks the catalog rather than erroring.
      - name: Path parameter and visibility tests
        env:
          DB_PATH: ${{ runner.temp }}/ci-pathparams.db
          JWT_SECRET: ci-only-not-a-real-secret
        run: npm run test:pathparams -w @trident/node-backend

      # The reachability classifier, and the hysteresis that stops one bad
      # reading from writing an endpoint off. No network: probeOnce is pure over
      # a status code, and the streak logic drives the database directly.
      - name: Status prober tests
        env:
          DB_PATH: ${{ runner.temp }}/ci-status.db
          JWT_SECRET: ci-only-not-a-real-secret
        run: npm run test:status -w @trident/node-backend

      # Which chain a payment settles on and what has to move first. Pure
      # selection logic, but the alternative to getting it right is not an error
      # message: it is USDC crossing a bridge it did not need to cross, or a
      # service called unaffordable while the money sits one chain away.
      - name: Funding ladder tests
        env:
          DB_PATH: ${{ runner.temp }}/ci-funding.db
          JWT_SECRET: ci-only-not-a-real-secret
        run: npm run test:funding -w @trident/node-backend

      # How a Circle transaction's terminal state is read, and the chain-key
      # mapping. Runs without credentials by design. A terminal failure read as
      # success reports a charge that never happened, and a wrong chain key
      # sends real USDC to the right address on the wrong network.
      - name: Circle wallet tests
        env:
          DB_PATH: ${{ runner.temp }}/ci-circle.db
          JWT_SECRET: ci-only-not-a-real-secret
        run: npm run test:circle -w @trident/node-backend

      # The Gateway burn intent, diffed field by field against the SDK's own.
      # GatewayClient cannot take a signer, so we rebuild its intent by hand;
      # EIP-712 hashes a struct in declaration order, so a moved field yields a
      # signature Circle rejects, or accepts for the wrong destination. Local
      # only: no credentials, nothing signed, nothing sent.
      - name: Gateway move tests
        env:
          DB_PATH: ${{ runner.temp }}/ci-gateway-moves.db
          JWT_SECRET: ci-only-not-a-real-secret
        run: npm run test:gateway-moves -w @trident/node-backend

      # Messages the browser signs and the server verifies exist in both
      # packages and must stay byte-identical. A signature is over exact bytes,
      # so one reordered line breaks re-encryption and the passphrase gate for
      # every user at once, and a comment saying "keep these in sync" enforces
      # nothing.
      - name: Cross-package message tests
        env:
          DB_PATH: ${{ runner.temp }}/ci-cross-package.db
          JWT_SECRET: ci-only-not-a-real-secret
        run: npm run test:cross-package -w @trident/node-backend

      # The Builder Code suffix appended to transactions we broadcast. Cheap to
      # run and worth gating on: with no code configured it must append nothing
      # at all, because this shipped before the code existed and a stray suffix
      # would alter the calldata of transactions that move real USDC.
      - name: Attribution tests
        env:
          DB_PATH: ${{ runner.temp }}/ci-attribution.db
          JWT_SECRET: ci-only-not-a-real-secret
          BUILDER_CODE: ""
        run: npm run test:attribution -w @trident/node-backend

      # The keeper's gas sponsorship, and specifically its cap. This is a funded
      # key that any account holder can cause to spend, so the cap is the whole
      # control and the tests are the refusals rather than the happy path.
      # Nothing here sends a transaction.
      - name: Gas sponsor tests
        env:
          DB_PATH: ${{ runner.temp }}/ci-gas.db
          JWT_SECRET: ci-only-not-a-real-secret
        run: npm run test:gas -w @trident/node-backend

      # The seam every other suite misses: what signup writes against what the
      # routes read. A commit stopped writing users.eoa_address and left three
      # routes gating on it, so every new account got 409 on its balance, its
      # deposit address and its first run — with every suite above green. This
      # boots the real server, seeds a row shaped as signup leaves it, and asks
      # the routes about it. No credentials: the Circle call is on the far side
      # of the seam being tested.
      - name: Account route tests
        env:
          DB_PATH: ${{ runner.temp }}/ci-account.db
          JWT_SECRET: ci-only-not-a-real-secret
        run: npm run test:account -w @trident/node-backend

      # The full signup path, against a running backend. Without Circle sandbox
      # credentials it verifies that signup refuses clearly and stops there, so
      # it is safe to gate merges on as it stands; add CIRCLE_API_KEY,
      # CIRCLE_ENTITY_SECRET and CIRCLE_WALLET_SET_ID as repository secrets and
      # the same job starts covering wallet creation, the passphrase gate and a
      # real run end to end.
      - name: End-to-end suite
        env:
          DB_PATH: ${{ runner.temp }}/ci-e2e.db
          JWT_SECRET: ci-only-not-a-real-secret
          PORT: "3001"
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
          CIRCLE_ENTITY_SECRET: ${{ secrets.CIRCLE_ENTITY_SECRET }}
          CIRCLE_WALLET_SET_ID: ${{ secrets.CIRCLE_WALLET_SET_ID }}
        working-directory: apps/node-backend
        run: |
          node --experimental-strip-types src/server.ts &
          SERVER_PID=$!
          # Fail loudly if it never comes up, rather than running the suite
          # against nothing and reporting a wall of connection errors.
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3001/health >/dev/null || { echo "backend did not start"; kill $SERVER_PID; exit 1; }
          # `|| STATUS=$?` rather than a bare call: the shell runs with -e, so a
          # failing suite would exit here and leave the server running.
          STATUS=0
          npm run test:e2e || STATUS=$?
          kill $SERVER_PID
          exit $STATUS
