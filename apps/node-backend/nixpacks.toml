[phases.setup]
aptPkgs = ["python3", "make", "g++", "libsqlite3-dev"]
# Required for better-sqlite3 native compilation.
# Without these, the Railway build fails with: gyp ERR! build error

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npx esbuild src/server.ts --bundle --platform=node --format=esm --packages=external --outfile=dist/server.js"
]

[start]
cmd = "node dist/server.js"
